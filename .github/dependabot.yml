version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '08:00'
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - '*'

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '08:30'
    open-pull-requests-limit: 10
    versioning-strategy: increase
    groups:
      security-runtime:
        applies-to: security-updates
        patterns:
          - '*'
      nuxt-stack:
        patterns:
          - nuxt
          - '@nuxt/*'
          - '@nuxtjs/*'
          - '@pinia/*'
          - pinia
          - tailwindcss
      test-tooling:
        patterns:
          - '@nuxt/test-utils'
          - '@vue/test-utils'
          - vitest
          - happy-dom
          - eslint
          - prettier
          - '@vue/language-core'
          - vue-tsc
          - typescript
